name: Apply Remaining Functional ERP Fixes

on:
  pull_request:
    branches: [Development]

permissions:
  contents: write

jobs:
  apply-remaining-functional-fixes:
    if: github.head_ref == 'fix/full-erp-accounting-regressions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/apply-remaining-functional-fixes.mjs
      - run: npm run check
      - name: Commit functional fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git commit -m "Fix attachment opening and AP vendor selection"
          git push origin HEAD:${{ github.head_ref }}
