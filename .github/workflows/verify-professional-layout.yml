name: Verify Professional ERP Layout

on:
  pull_request:
    branches:
      - fix/professional-erp-layout

permissions:
  contents: read

jobs:
  professional-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/professional-erp-layout
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Prepare isolated E2E data
        run: rm -rf data/security
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run professional responsive layout tests
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: E2E-Strong-Password-2026!
        run: npx playwright test e2e/responsive-layout.spec.js --workers=1
