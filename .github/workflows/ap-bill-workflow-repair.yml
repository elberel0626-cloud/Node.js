name: AP Bill Workflow Repair

on:
  push:
    branches:
      - fix/ap-bill-save-approval-posting
    paths:
      - scripts/apply-ap-bill-workflow-fix-v2.mjs
      - .github/workflows/ap-bill-workflow-repair.yml

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/ap-bill-save-approval-posting

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply AP workflow fix
        run: node scripts/apply-ap-bill-workflow-fix-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and unit tests
        run: |
          npm run check
          npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run AP workflow end-to-end tests
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: E2E-Admin-Password-2026!
        run: npx playwright test e2e/ap-bill-workflow.spec.js e2e/ap-bill-attachments.spec.js --workers=1

      - name: Commit verified fix
        run: |
          set -euo pipefail
          rm -f scripts/apply-ap-bill-workflow-fix.mjs scripts/apply-ap-bill-workflow-fix-v2.mjs .github/workflows/ap-bill-workflow-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Fix AP bill attachment approval and posting workflow"
          git push origin HEAD:fix/ap-bill-save-approval-posting
