name: Verify AP Bills PO Status

on:
  push:
    branches: [Development]
    paths:
      - public/apBillsPoStatusColumns.js
      - public/index.html
      - src/apRuntimeReliabilityPatch.js
      - test/apRuntimeReliabilityPatch.test.js
      - package.json
      - e2e/ap-bills-po-status.spec.js
      - .github/workflows/verify-ap-bills-po-status.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-ap-bills-po-status:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: AP list runtime regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run check && node --test test/apRuntimeReliabilityPatch.test.js
          rc=$?
          state=success
          description='AP bill list runtime and legacy serialization safety passed'
          if [ "$rc" -ne 0 ]; then state=failure; description='AP bill list runtime or serialization safety failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-bills/list-runtime' -f description="$description" >/dev/null
          exit "$rc"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare ephemeral test login
        run: |
          echo "E2E_ADMIN_EMAIL=ap-bills-e2e@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - name: Browser running AP Bills list API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-bills-po-status.spec.js -g 'running AP Bills list API returns'
          rc=$?
          state=success
          description='Running AP Bills list API returned serialized bills successfully'
          if [ "$rc" -ne 0 ]; then state=failure; description='Running AP Bills list API failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-bills/api-list' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser AP Bills screen replacement
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-bills-po-status.spec.js -g 'renders the Bills and Adjustments screen'
          rc=$?
          state=success
          description='AP sidebar click rendered the Bills and Adjustments screen'
          if [ "$rc" -ne 0 ]; then state=failure; description='AP Bills URL changed but prior screen remained visible'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-bills/screen' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser AP Bills sidebar active state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-bills-po-status.spec.js -g 'moves the active sidebar selection'
          rc=$?
          state=success
          description='AP sidebar active selection moved to Bills and Adjustments'
          if [ "$rc" -ne 0 ]; then state=failure; description='AP sidebar active selection remained on the prior screen'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-bills/sidebar-active' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser Bills PO columns
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-bills-po-status.spec.js -g 'shows PO Number and exact live PO Match Status'
          rc=$?
          state=success
          description='Bills and Adjustments shows PO Number and exact live PO Match Status'
          if [ "$rc" -ne 0 ]; then state=failure; description='AP bills PO Number or PO Match Status list failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-bills/po-status-list' -f description="$description" >/dev/null
          exit "$rc"
