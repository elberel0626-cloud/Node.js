name: Verify AP Bills PO Status

on:
  push:
    branches: [Development]
    paths:
      - public/apBillsPoStatusColumns.js
      - public/index.html
      - package.json
      - e2e/ap-bills-po-status.spec.js
      - .github/workflows/verify-ap-bills-po-status.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-ap-bills-po-status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare ephemeral test login
        run: |
          echo "E2E_ADMIN_EMAIL=ap-bills-e2e@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - name: Browser Bills and Adjustments PO columns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-bills-po-status.spec.js
          rc=$?
          state=success
          description='Bills and Adjustments shows PO Number and live PO Match Status'
          if [ "$rc" -ne 0 ]; then state=failure; description='AP bills PO Number or PO Match Status list failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-bills/po-status-list' -f description="$description" >/dev/null
          exit "$rc"
