name: Dependency Repair

on:
  push:
    branches:
      - codex/perform-security-hardening-sprint-for-erp
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/perform-security-hardening-sprint-for-erp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate dependencies from npm registry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json
          ARGON2_VERSION="$(npm view argon2 version)"
          NODEMAILER_VERSION="$(npm view nodemailer version)"
          npm pkg set "dependencies.argon2=${ARGON2_VERSION}"
          npm pkg set "optionalDependencies.nodemailer=${NODEMAILER_VERSION}"
          npm install
          npm ls argon2 node-addon-api nodemailer

      - name: Verify clean npm ci
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci

      - name: Run non-browser checks
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm test
          npm run test:security

      - name: Commit repaired dependency files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Fix security dependencies and regenerate lockfile"
          git push origin HEAD:codex/perform-security-hardening-sprint-for-erp
