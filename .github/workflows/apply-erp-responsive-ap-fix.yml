name: Verify ERP responsive and AP posting fix

on:
  pull_request:
    branches:
      - fix/responsive-ap-posting-journal-descriptions

permissions:
  contents: read

jobs:
  targeted-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/responsive-ap-posting-journal-descriptions

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Prepare isolated E2E data
        run: rm -rf data/security

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: AP posting and responsive E2E tests
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: E2E-Strong-Password-2026!
        run: npx playwright test e2e/ap-posting-safety.spec.js e2e/responsive-layout.spec.js --workers=1
