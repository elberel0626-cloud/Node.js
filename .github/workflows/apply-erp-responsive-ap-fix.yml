name: Apply ERP responsive and AP posting fix

on:
  push:
    branches:
      - fix/responsive-ap-posting-journal-descriptions
  pull_request:
    branches:
      - fix/responsive-ap-posting-journal-descriptions

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/responsive-ap-posting-journal-descriptions
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair patch helper replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_erp_fix.py')
          s=p.read_text()
          old="out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new="out, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY

      - name: Apply deterministic source patch
        run: python scripts/apply_erp_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Prepare isolated E2E data
        run: rm -rf data/security

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: AP posting and responsive E2E tests
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: E2E-Strong-Password-2026!
        run: npx playwright test e2e/ap-posting-safety.spec.js e2e/responsive-layout.spec.js --workers=1

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js public/index.html scripts/apply_erp_fix.py
          git diff --cached --check
          git commit -m "Fix responsive layout and safe AP posting"
          git push origin HEAD:fix/responsive-ap-posting-journal-descriptions
