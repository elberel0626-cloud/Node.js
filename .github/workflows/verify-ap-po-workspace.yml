name: Verify AP PO Workspace

on:
  push:
    branches: [Development]
    paths:
      - public/apPurchaseOrderWorkspace.js
      - public/apIncomingCreateBillFix.js
      - public/apProfessionalMatchingV2.js
      - public/apNewBillProfessionalPo.js
      - public/apPoVendorAutoRefresh.js
      - public/apBillMatchStatusGlParity.js
      - public/apBillLineGlOutline.js
      - public/index.html
      - src/apInvoiceEvaluation.js
      - src/apIncomingConversionPatch.js
      - src/incomingReviewSavePatch.js
      - src/apRuntimeReliabilityPatch.js
      - src/routePermissions.js
      - src/start.js
      - test/apInvoiceNegativeLines.test.js
      - test/apProfessionalPoWorkspace.test.js
      - test/apProfessionalMatchingV2.test.js
      - test/apNewBillProfessionalPo.test.js
      - test/apBillMatchStatusGlParity.test.js
      - test/apIncomingConversionPatch.test.js
      - test/incomingReviewSavePatch.test.js
      - test/apRuntimeReliabilityPatch.test.js
      - test/poMatchingPermissions.test.js
      - e2e/ap-po-incoming-reliability.spec.js
      - e2e/ap-new-bill-professional-po.spec.js
      - e2e/ap-new-bill-live-preview.spec.js
      - package.json
      - .github/workflows/verify-ap-po-workspace.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-ap-po-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run check
          rc=$?
          state=success
          description='Syntax and startup composition passed'
          if [ "$rc" -ne 0 ]; then state=failure; description='Syntax or startup composition failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/syntax' -f description="$description" >/dev/null
          exit "$rc"
      - name: AP PO focused regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node --test test/apInvoiceNegativeLines.test.js test/apProfessionalPoWorkspace.test.js test/apProfessionalMatchingV2.test.js test/apNewBillProfessionalPo.test.js test/apBillMatchStatusGlParity.test.js test/apIncomingConversionPatch.test.js test/incomingReviewSavePatch.test.js test/apRuntimeReliabilityPatch.test.js test/poMatchingPermissions.test.js test/purchaseOrderPreferencesPatch.test.js
          rc=$?
          state=success
          description='AP incoming, signed GL, live match status, GL detail, and PO regressions passed'
          if [ "$rc" -ne 0 ]; then state=failure; description='AP live match status, GL detail, incoming, signed GL, or PO regression failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/regression' -f description="$description" >/dev/null
          exit "$rc"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare ephemeral test login
        run: |
          echo "E2E_ADMIN_EMAIL=ap-po-e2e@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - name: Browser unsaved PO preview API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-new-bill-live-preview.spec.js -g 'preview API returns'
          rc=$?
          state=success
          description='Unsaved AP preview API returned server 3-way status'
          if [ "$rc" -ne 0 ]; then state=failure; description='Unsaved AP preview API failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-preview-api' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser new bill GL labels
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-new-bill-live-preview.spec.js -g 'labels GL code before save'
          rc=$?
          state=success
          description='New AP Bill labels GL Code and GL Account Description before save'
          if [ "$rc" -ne 0 ]; then state=failure; description='New AP Bill GL labels before save failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-gl-labels' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser new bill default GL
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-new-bill-live-preview.spec.js -g 'has default GL account before save'
          rc=$?
          state=success
          description='New AP Bill has a GL account value before save'
          if [ "$rc" -ne 0 ]; then state=failure; description='New AP Bill default GL account before save failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-gl-value' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser new bill GL annotation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-new-bill-live-preview.spec.js -g 'shows effective GL annotation before save'
          rc=$?
          state=success
          description='New AP Bill shows effective GL annotation before save'
          if [ "$rc" -ne 0 ]; then state=failure; description='New AP Bill effective GL annotation before save failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-gl-annotation' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser new bill status parity
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-new-bill-live-preview.spec.js -g 'displays same server match status'
          rc=$?
          state=success
          description='New AP Bill displays exact server match status before save'
          if [ "$rc" -ne 0 ]; then state=failure; description='New AP Bill server match status before save failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-new-status' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser new bill professional PO workspace
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-new-bill-professional-po.spec.js
          rc=$?
          state=success
          description='New AP Bill shows live PO status and GL code before save'
          if [ "$rc" -ne 0 ]; then state=failure; description='New AP Bill live PO status or GL code before save failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-new-bill' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser incoming save and create
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-po-incoming-reliability.spec.js -g 'incoming review saves'
          rc=$?
          state=success
          description='Incoming review save and AP Bill create passed, including negative reconciliation lines'
          if [ "$rc" -ne 0 ]; then state=failure; description='Incoming review save or AP Bill create failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-incoming' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser signed AP GL posting
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-po-incoming-reliability.spec.js -g 'negative AP bill lines post as positive GL credits'
          rc=$?
          state=success
          description='Negative AP bill lines posted as positive GL credits and journal balanced'
          if [ "$rc" -ne 0 ]; then state=failure; description='Signed AP GL debit/credit posting failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-signed-gl' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser eligible PO lookup
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-po-incoming-reliability.spec.js -g 'eligible vendor PO lookup returns'
          rc=$?
          state=success
          description='Eligible-only vendor PO lookup returned vendor PO'
          if [ "$rc" -ne 0 ]; then state=failure; description='Eligible-only vendor PO lookup failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-po-api' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser eligible PO display
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-po-incoming-reliability.spec.js -g 'eligible vendor PO renders'
          rc=$?
          state=success
          description='Eligible vendor PO appears in AP Purchase Order tab'
          if [ "$rc" -ne 0 ]; then state=failure; description='Eligible vendor PO did not render in AP tab'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-po-visible' -f description="$description" >/dev/null
          exit "$rc"
      - name: Browser eligible PO select and save
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx playwright test e2e/ap-po-incoming-reliability.spec.js -g 'eligible vendor PO can be selected'
          rc=$?
          state=success
          description='Eligible vendor PO selected, saved, and match status persisted'
          if [ "$rc" -ne 0 ]; then state=failure; description='Eligible vendor PO select/save failed'; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='ap-po/browser-po-save' -f description="$description" >/dev/null
          exit "$rc"
