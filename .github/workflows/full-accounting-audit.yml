name: Full Accounting Audit

on:
  pull_request:
    branches: [Development]

permissions:
  contents: read

jobs:
  full-accounting-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Ephemeral test-only bootstrap credentials for the isolated GitHub Actions runner.
      E2E_ADMIN_EMAIL: e2e.audit@example.invalid
      E2E_ADMIN_PASSWORD: ERP-Audit-Only-2026!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Integrated purchase-to-pay and order-to-cash audit
        run: npx playwright test e2e/full-accounting-lifecycle-audit.spec.js --workers=1 --reporter=line

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-accounting-audit-playwright-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
