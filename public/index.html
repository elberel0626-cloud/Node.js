<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>ERP</title><link rel='stylesheet' href='/styles.css'></head>
<body>
<main id='login-screen' class='centered'><form id='login-form' class='card'><h1>ERP Login</h1><input id='username' placeholder='Username' required><input id='password' type='password' placeholder='Password' required><button>Sign In</button><p id='login-error' class='error'></p></form></main>
<div id='app' class='hidden'>
<aside class='sidebar'><h2>Modules</h2><nav id='module-nav'></nav></aside>
<section class='content'>
<header class='topbar'><h1 id='view-title'>Dashboard</h1><div class='actions'><button id='new-invoice'>New Invoice</button><button id='new-payment'>New Payment</button><button id='new-customer'>New Customer</button></div></header>
<section id='dashboard' class='view'><div class='cards' id='metric-cards'></div></section>
<section id='ar-home' class='view hidden'><div id='ar-groups' class='cards'></div></section>
<section id='ar-data' class='view hidden'>
<h2>Customers</h2><table><thead><tr><th>#</th><th>Name</th><th>Terms</th><th>Status</th><th>Balance</th></tr></thead><tbody id='customer-table'></tbody></table>
<h2>Invoices and Memos</h2><table><thead><tr><th>Invoice #</th><th>Customer</th><th>Total</th><th>Date</th><th>Status</th></tr></thead><tbody id='invoice-table'></tbody></table>
<h2>GL Accounts</h2><table><thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Type</th><th>Balance</th></tr></thead><tbody id='gl-table'></tbody></table>
</section>
</section></div>
<script type='module' src='/app.js'></script></body></html>
